// NOTE: this file is the standard Flutter Groovy build format
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterSdkPath = localProperties.getProperty("flutter.sdk")
if (flutterSdkPath == null) {
    throw new GradleException("flutter.sdk not set in local.properties")
}

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.nusha.messenger"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            storeFile file("nusha3.jks")
            storePassword System.getenv("KEY_STORE_PASSWORD") ?: "nusha3pass"
            keyAlias System.getenv("KEY_ALIAS") ?: "nusha3"
            keyPassword System.getenv("KEY_PASSWORD") ?: "nusha3pass"
        }
    }

    defaultConfig {
        applicationId "com.nusha.messenger"
        minSdkVersion 24
        targetSdkVersion flutter.targetSdkVersion
        versionCode 2
        versionName "1.1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    
    // Explicitly add Flutter Engine for Kotlin compilation
    // This is needed because the plugin sometimes doesn't add it to compileClasspath
    def engineArmDir = new File("${flutterSdkPath}/bin/cache/artifacts/engine/android-arm64-release")
    if (engineArmDir.exists()) {
        compileOnly fileTree(dir: engineArmDir.absolutePath, include: ["*.jar"])
    }
    def engineArmDir2 = new File("${flutterSdkPath}/bin/cache/artifacts/engine/android-arm-release")
    if (engineArmDir2.exists()) {
        compileOnly fileTree(dir: engineArmDir2.absolutePath, include: ["*.jar"])
    }
}
