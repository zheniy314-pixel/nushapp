plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.nusha.messenger"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        release {
            storeFile file("nusha3.jks")
            storePassword System.getenv("KEY_STORE_PASSWORD") ?: "nusha3pass"
            keyAlias System.getenv("KEY_ALIAS") ?: "nusha3"
            keyPassword System.getenv("KEY_PASSWORD") ?: "nusha3pass"
        }
    }

    defaultConfig {
        applicationId "com.nusha.messenger"
        minSdkVersion 24
        targetSdkVersion flutter.targetSdkVersion
        versionCode 2
        versionName "1.1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

def MINIMAL_GPR_STUB = 'package io.flutter.plugins;\n' +
    'public final class GeneratedPluginRegistrant {\n' +
    '    public static void registerWith(Object flutterEngine) {}\n' +
    '}\n'

def stubGPR = tasks.register("stubGeneratedPluginRegistrant") {
    doFirst {
        def gprFile = file("src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java")
        gprFile.parentFile.mkdirs()
        gprFile.text = MINIMAL_GPR_STUB
        println("Minimal GPR stub written")
    }
}

afterEvaluate {
    tasks.matching { it.name.startsWith("compile") && (it.name.contains("Java") || it.name.contains("Kotlin")) }.each { task ->
        task.dependsOn stubGPR
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
