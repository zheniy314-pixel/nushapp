name: iOS TestFlight Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
        env:
          LANG: en_US.UTF-8

      - name: Write App Store Connect key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_AUTH_KEY_P8 }}" > ~/private_keys/AuthKey_NP997PBKF9.p8
          chmod 600 ~/private_keys/AuthKey_NP997PBKF9.p8

      - name: Build and Archive
        run: |
          flutter build ios --release --no-codesign \
            --build-name=1.1.0 \
            --build-number=${{ github.run_number }}
          
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=T5P2P6NTS6 \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_NP997PBKF9.p8 \
            -authenticationKeyID NP997PBKF9 \
            -authenticationKeyIssuerID ${{ secrets.APPLE_ISSUER_ID }}

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build/ios-output \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_NP997PBKF9.p8 \
            -authenticationKeyID NP997PBKF9 \
            -authenticationKeyIssuerID ${{ secrets.APPLE_ISSUER_ID }}

      - name: Upload to TestFlight
        run: |
          IPA=$(find build/ios-output -name "*.ipa" | head -1)
          echo "Uploading: $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey NP997PBKF9 \
            --apiIssuer ${{ secrets.APPLE_ISSUER_ID }} \
            --verbose || \
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey ${{ secrets.APPLE_KEY_ID }} \
            --apiIssuer ${{ secrets.APPLE_ISSUER_ID }}

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nusha3-iOS-${{ github.run_number }}.ipa
          path: |
            build/ios-output/*.ipa
            build/Runner.xcarchive/**
          retention-days: 30
