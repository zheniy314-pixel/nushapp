name: iOS TestFlight Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Flutter pub get (generates iOS configs)
        run: |
          flutter pub get
          echo "Generated.xcconfig:"
          cat ios/Flutter/Generated.xcconfig 2>/dev/null || echo "not found"

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
        env:
          LANG: en_US.UTF-8

      - name: Write App Store Connect key
        run: |
          mkdir -p ios/fastlane
          echo "${{ secrets.APPLE_AUTH_KEY_P8 }}" > ios/fastlane/AuthKey_NP997PBKF9.p8
          chmod 600 ios/fastlane/AuthKey_NP997PBKF9.p8

      - name: Build IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          flutter build ipa --release \
            --build-name=1.1.0 \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight via xcrun
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPLE_KEY_ID" \
            --apiIssuer "$APPLE_ISSUER_ID" \
            --verbose

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nusha3-iOS-${{ github.run_number }}.ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30
