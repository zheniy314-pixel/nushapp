name: nusha3
description: Calculator app (secure messenger inside)
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Networking
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1
  file_picker: ^8.1.7

  # Local DB (encrypted)
  sqflite: ^2.3.3
  sqflite_sqlcipher: ^3.0.1
  path: ^1.9.0

  # Secure storage (Keychain/Keystore)
  flutter_secure_storage: ^9.2.2

  # Media
  image_picker: ^1.1.2
  video_player: ^2.9.1
  cached_network_image: ^3.3.1
  just_audio: ^0.9.39
  # record: ^5.1.3  # TODO: add after resolving platform compat
  camera: ^0.11.0+2

  # WebRTC (calls + conferences)
  flutter_webrtc: 0.11.7

  # Bluetooth
  flutter_blue_plus: ^1.32.12

  # Notifications
  flutter_local_notifications: ^17.2.3
  firebase_messaging: ^15.1.3
  firebase_core: ^3.6.0

  # Background service — keeps socket alive even on calculator screen / killed
  flutter_background_service: ^5.1.0

  # UI
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  photo_view: ^0.15.0
  emoji_picker_flutter: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.2

  # Utils
  uuid: ^4.4.2
  crypto: ^3.0.3
  convert: ^3.1.1
  collection: ^1.18.0
  rxdart: ^0.27.7
  equatable: ^2.0.5
  json_annotation: ^4.9.0

  # Platform specific
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  connectivity_plus: ^6.0.5
  wakelock_plus: ^1.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # fonts: (Inter font files not bundled yet - using system font)
